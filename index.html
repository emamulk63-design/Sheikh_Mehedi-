<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Boltu MoreNai</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Boltu MoreNai">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #game-container canvas {
            display: block !important;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            margin: 0 !important;
        }

        /* Welcome Popup Styles */
        #welcomePopup {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.88);
            padding: 20px;
            animation: popupIn .5s ease;
        }

        .welcomeBox {
            width: min(380px, 100%);
            background: #fff;
            border-radius: 20px;
            padding: 25px 20px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
        }

        .welcomeBox img {
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 14px;
            display: block;
            margin: 0 auto 15px;
        }

        /* হাইলাইট টেক্সট */
        .highlight-text {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            padding: 10px 15px;
            border-radius: 12px;
            display: inline-block;
            color: #000 !important;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255,215,0,0.6);
            box-shadow: 0 0 25px rgba(255,215,0,0.4);
            margin: 8px 0;
        }

        .welcomeBox h2 {
            margin: 18px 0 10px;
            font-size: 22px;
            color: #111;
        }

        .welcomeBox p {
            margin: 0 0 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        /* Play Now বাটন */
        #playNowBtn {
            display: inline-block;
            padding: 14px 45px;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(45deg, #FF6B35, #FF4500);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255,69,0,0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            margin-top: 10px;
        }

        #playNowBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255,69,0,0.8);
        }

        #playNowBtn:active {
            transform: scale(0.95);
        }

        @keyframes popupIn {
            from {
                opacity: 0;
                transform: scale(.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popupOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(.8);
            }
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <!-- Welcome Popup -->
    <div id="welcomePopup">
        <div class="welcomeBox">
            <img
                src="https://github.com/emamulk63-design/Sheikh_Mehedi-/raw/refs/heads/main/assets/images/1786787062938.png"
                alt="Welcome"
            >
            <h2 class="highlight-text">বঙ্গবল্টু গেমে আপনাকে স্বাগতম</h2>
            <p class="highlight-text">গেমটি ডেভেলপমেন্ট করছে শেখ মেহেদী বঙ্গবল্টুর পারসোনাল সৈনিক</p>
            
            <!-- Play Now বাটন (শুধু গেম ওপেন করবে) -->
            <a id="playNowBtn" href="https://emamulk63-design.github.io/Sheikh_Mehedi-/">
                ▶ Play Now
            </a>
        </div>
    </div>

    <!-- অডিও এলিমেন্ট -->
    <audio id="welcomeAudio" preload="auto">
        <source src="https://raw.githubusercontent.com/emamulk63-design/Sheikh_Mehedi-/main/Sheikhmededi.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="game.js"></script>

    <script>
        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered:', reg.scope))
                    .catch((err) => console.error('Service Worker registration failed:', err));
            });
        }

        // ====== অডিও অটোপ্লে ======
        document.addEventListener("DOMContentLoaded", function() {
            const audio = document.getElementById("welcomeAudio");
            const popup = document.getElementById("welcomePopup");

            // Web Audio API দিয়ে অডিও কনটেক্সট আনলক
            function unlockAudioContext() {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                if (context.state === 'suspended') {
                    context.resume().then(() => {
                        console.log('AudioContext resumed!');
                        audio.play().catch(e => console.log('Play error:', e));
                    });
                } else {
                    audio.play().catch(e => console.log('Play error:', e));
                }
            }

            // পেজ লোড হতেই অডিও প্লে করার চেষ্টা
            unlockAudioContext();

            // ব্যাকআপ: ১ সেকেন্ড পর আবার চেষ্টা
            setTimeout(() => {
                audio.play().catch(e => console.log('Retry play error:', e));
            }, 1000);

            // অডিও শেষ হলে পপআপ বন্ধ
            audio.addEventListener('ended', function() {
                closePopup();
            });

            // ব্যাকআপ: ২০ সেকেন্ড পর পপআপ বন্ধ (যদি অডিও না চলে)
            setTimeout(function() {
                if (popup) closePopup();
            }, 20000);

            function closePopup() {
                if (!popup) return;
                popup.style.animation = "popupOut .4s ease forwards";
                setTimeout(() => {
                    if (popup.parentNode) popup.remove();
                }, 400);
            }
        });
    </script>

</body>
</html>
